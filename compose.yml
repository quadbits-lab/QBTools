# QBTools production stack.
#   cp .env.example .env   # then edit
#   docker compose up -d --build
name: qbtools

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        VITE_SITE_URL: ${SITE_URL:-http://localhost:8310}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
        VITE_ADSENSE_SLOT_TOP: ${VITE_ADSENSE_SLOT_TOP:-}
        VITE_ADSENSE_SLOT_BOTTOM: ${VITE_ADSENSE_SLOT_BOTTOM:-}
        VITE_ANALYTICS_SRC: ${VITE_ANALYTICS_SRC:-}
        VITE_ANALYTICS_DOMAIN: ${VITE_ANALYTICS_DOMAIN:-}
        VITE_ANALYTICS_WEBSITE_ID: ${VITE_ANALYTICS_WEBSITE_ID:-}
    image: qbtools:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/qbtools.db
      PGLITE_DATA_DIR: /data/users
      PORT: "8310"
    ports:
      - "${PORT:-8310}:8310"
    volumes:
      - qbtools-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8310/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional, isolated local object storage. Production may use an existing RustFS.
  rustfs:
    profiles: [storage]
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-}
      RUSTFS_CONSOLE_ENABLE: "true"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      [
        'test -n "$$RUSTFS_ACCESS_KEY" && test -n "$$RUSTFS_SECRET_KEY" || { echo "Set unique RustFS credentials" >&2; exit 1; }; exec /entrypoint.sh /data',
      ]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    networks: [ollama]
    volumes:
      - qbtools-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ollama-proxy:
    profiles: ["ollama"]
    image: caddy:2-alpine
    networks: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    ports:
      - "${OLLAMA_PORT:-8172}:8080"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$OLLAMA_API_KEY" ]; then
          echo "OLLAMA_API_KEY is required" >&2
          exit 1
        fi
        case "$$OLLAMA_API_KEY" in
          *[!A-Za-z0-9_-]*)
            echo "OLLAMA_API_KEY must contain only letters, digits, hyphens, and underscores" >&2
            exit 1
            ;;
        esac
        cat > /etc/caddy/Caddyfile <<'EOF'
        :8080 {
        	@denied not header Authorization "Bearer {$$OLLAMA_API_KEY}"
        	respond @denied "Unauthorized" 401
        	reverse_proxy ollama:11434
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -q -O /dev/null --header="Authorization: Bearer $$OLLAMA_API_KEY" http://127.0.0.1:8080/api/tags',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  ollama:

volumes:
  qbtools-data:
  rustfs-data:
  qbtools-ollama-data:
