<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1f1f1f" />
		<meta name="robots" content="noindex" />
		<title>Offline — QBTools</title>
		<style>
			:root {
				color-scheme: dark light;
				--background: #111111;
				--foreground: #f8f8f8;
				--muted: #b7b7b7;
				--surface: #1a1a1a;
				--border: #191919;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--background: #ffffff;
					--foreground: #0d0d0d;
					--muted: #555555;
					--surface: #f7f7f7;
					--border: #e4e4e4;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background: var(--background);
				color: var(--foreground);
				font-family:
					ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
					sans-serif;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
			}
			main {
				width: 100%;
				max-width: 30rem;
				border: 1px solid var(--border);
				background: var(--surface);
				padding: 2rem;
				text-align: center;
			}
			.logo {
				display: inline-block;
				margin-bottom: 1.25rem;
				font-size: 0.8125rem;
				font-weight: 600;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: var(--muted);
			}
			h1 {
				margin: 0 0 0.75rem;
				font-size: 1.5rem;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			p {
				margin: 0 0 1.5rem;
				color: var(--muted);
				font-size: 0.95rem;
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				justify-content: center;
			}
			button,
			a.action {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 2.5rem;
				padding: 0 1rem;
				border: 1px solid transparent;
				border-radius: 0.375rem;
				font: inherit;
				font-size: 0.875rem;
				font-weight: 500;
				text-decoration: none;
				cursor: pointer;
			}
			button {
				background: var(--foreground);
				color: var(--background);
			}
			a.action {
				border-color: var(--border);
				background: transparent;
				color: var(--foreground);
			}
			button:hover,
			a.action:hover {
				opacity: 0.88;
			}
			:focus-visible {
				outline: 2px solid var(--foreground);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<span class="logo">QBTools</span>
			<h1>You are offline</h1>
			<p>
				This page was not saved for offline use, and there is no connection right now. Pages you
				have already opened keep working — your files still never leave your device.
			</p>
			<div class="actions">
				<button type="button" onclick="window.location.reload()">Try again</button>
				<a class="action" href="/">Go to homepage</a>
			</div>
		</main>
	</body>
</html>
