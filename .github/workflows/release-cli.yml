name: Release CLI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches package version
        working-directory: apps/cli
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test apps/cli packages/engines packages/registry

      - name: Build bundle
        run: bun run --cwd apps/cli build:package

      - name: Verify package contents
        working-directory: apps/cli
        run: |
          npm pack
          tar -tzf qbtools-*.tgz | grep -q "package/dist/bin.js"
          tar -tzf qbtools-*.tgz | grep -q "package/docs/features.md"
          ! tar -tzf qbtools-*.tgz | grep -q "dist/qbtools$"

      - name: Smoke test the bundle
        working-directory: apps/cli
        run: |
          bun dist/bin.js version
          echo "smoke" | bun dist/bin.js run word-counter --stdin --json

      - name: Publish to npm
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
