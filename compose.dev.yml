# Containerized development with hot reload (optional — `bun run dev` locally is faster).
#   docker compose -f compose.dev.yml up
name: qbtools-dev

services:
  dev:
    image: oven/bun:1.4.3-slim
    working_dir: /repo
    command: sh -c "bun install && bun run --cwd apps/web dev --host 0.0.0.0"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /repo/apps/web/data/qbtools.db
    ports:
      - "8310:8310"
    volumes:
      - .:/repo
      - dev-node-modules:/repo/node_modules

volumes:
  dev-node-modules:
